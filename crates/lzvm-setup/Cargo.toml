[package]
name = "lzvm-setup"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "lzvm_setup"
path = "src/lib.rs"

[features]
default = []
cuda = ["dep:lzvm-accel", "lzvm-accel/cuda"]

[dependencies]
lzvm-accel = { path = "../lzvm-accel", optional = true }
lzvm-artifacts = { path = "../lzvm-artifacts" }
lzvm-field = { path = "../lzvm-field" }
