[package]
name = "lzvm-prover"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "lzvm_prover"
path = "src/lib.rs"

[features]
default = []
cuda = ["dep:lzvm-accel", "lzvm-accel/cuda"]

[dependencies]
libloading = "0.8"
lzvm-accel = { path = "../lzvm-accel", optional = true }
lzvm-artifacts = { path = "../lzvm-artifacts" }
lzvm-field = { path = "../lzvm-field" }
serde_json = "1"
sha2 = "0.10"
