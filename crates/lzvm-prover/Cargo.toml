[package]
name = "lzvm-prover"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "lzvm_prover"
path = "src/lib.rs"

[features]
default = []
cuda = ["dep:lzvm-accel", "lzvm-accel/cuda"]

[dependencies]
libloading = "0.8"
lzvm-accel = { path = "../lzvm-accel", optional = true }
lzvm-artifacts = { path = "../lzvm-artifacts", default-features = false }
lzvm-field = { path = "../lzvm-field" }
num-bigint = "0.4"
num-traits = "0.2"
secp256k1 = { version = "0.31", default-features = false }
sha2 = "0.10"
smallvec = "1"
tiny-keccak = { version = "2.0", features = ["keccak"] }
